<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 视频作品 — QT新月</title>
<meta name="description" content="QT新月的 AI 生成视频作品展示。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Zen+Old+Mincho:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: oklch(8% 0.015 270);
  --bg-raised: oklch(16% 0.010 270);
  --accent: oklch(60% 0.18 280);
  --accent-soft: oklch(50% 0.13 280);
  --accent-dim: oklch(30% 0.08 280);
  --gold: oklch(80% 0.14 95);
  --text-primary: oklch(92% 0.01 270);
  --text-secondary: oklch(72% 0.01 270);
  --text-muted: oklch(50% 0.01 265);
  --border: oklch(100% 0 0 / 0.06);
  --glass-bg: oklch(100% 0 0 / 0.04);
  --header-h: 64px; --content-max: 900px;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{
  font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif;
  font-size:1rem;line-height:1.8;color:var(--text-primary);background:var(--bg-deep);overflow-x:hidden
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, oklch(45% 0.12 300 / 0.3) 0%, transparent 60%),
    radial-gradient(ellipse 50% 70% at 85% 50%, oklch(50% 0.15 280 / 0.2) 0%, transparent 50%),
    radial-gradient(ellipse 50% 50% at 40% 80%, oklch(55% 0.08 270 / 0.15) 0%, transparent 60%);
  background-color:var(--bg-deep)
}
a{color:var(--accent);text-decoration:none;transition:color 200ms var(--ease-out-expo)}
a:hover{color:var(--gold)}
.container{max-width:var(--content-max);margin-inline:auto;padding-inline:1.5rem}
.noise-overlay{
  position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")
}

.site-header{
  position:fixed;top:0;left:0;right:0;z-index:100;height:var(--header-h);
  background:oklch(14% 0.015 270 / 0.55);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border)
}
.header-inner{max-width:var(--content-max);margin-inline:auto;padding-inline:1.5rem;height:100%;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:0.5rem;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:1rem;color:var(--text-primary)}
.brand-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-soft));display:flex;align-items:center;justify-content:center;font-size:0.9rem;color:#fff}

.page-hero{padding-block:calc(var(--header-h) + 3rem) 1.5rem;text-align:center}
.page-hero-icon{font-size:3rem;margin-bottom:0.5rem}
.page-hero h1{font-family:'Zen Old Mincho',serif;font-weight:900;font-size:2.5rem}
.page-hero p{color:var(--text-secondary);font-size:0.875rem;margin-top:0.5rem}

.video-section{padding-bottom:3rem}
.video-card{
  background:var(--glass-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:1.5rem
}
.video-wrapper{position:relative;background:#000}
.video-wrapper video{width:100%;display:block;max-height:70vh}
.video-info{padding:1.25rem 1.5rem}
.video-info h2{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:700;font-size:1.25rem;color:var(--text-primary);margin-bottom:0.25rem}
.video-info .meta{font-size:0.75rem;color:var(--text-muted);margin-bottom:0.5rem}
.video-info .tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:0.65rem;padding:2px 8px;border-radius:100px;background:oklch(60% 0.18 280 / 0.08);color:var(--accent-soft);border:1px solid oklch(60% 0.18 280 / 0.1)}

.empty-state{text-align:center;padding:5rem 2rem}
.empty-icon{font-size:4rem;margin-bottom:1rem;opacity:0.6}
.empty-state h3{font-family:'Zen Old Mincho',serif;font-size:1.5rem;color:var(--text-muted)}

.site-footer{border-top:1px solid var(--border);padding-block:2rem;text-align:center;color:var(--text-muted);font-size:0.75rem}
.footer-decor{font-family:'Zen Old Mincho',serif;color:oklch(35% 0.03 270);letter-spacing:0.2em;margin-bottom:0.25rem}
.footer-links{display:flex;justify-content:center;gap:1.5rem;margin-top:1rem}
.footer-links a{font-size:0.75rem;color:var(--text-muted)}

@media(max-width:640px){
  .page-hero h1{font-size:1.75rem}
  .video-info{padding:1rem}
  .video-info h2{font-size:1.1rem}
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:oklch(25% 0.01 270);border-radius:3px}
</style>
</head>
<body>
<div class="noise-overlay" aria-hidden="true"></div>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brand"><span class="brand-mark">月</span><span>QT新月</span></a>
    <a href="../index.html" style="font-size:0.875rem;color:var(--text-secondary)">← 回主页</a>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <div class="page-hero-icon">🎬</div>
    <h1>AI 视频作品</h1>
    <p>AI 生成视频 · 创意内容 · 动态视觉</p>
  </div>
</section>

<section class="video-section">
  <div class="container" id="videoList">
    <div class="video-card">
      <div class="video-wrapper">
        <video controls preload="metadata" poster="">
          <source src="ai-videos/ai-video-01.mp4" type="video/mp4">
          你的浏览器不支持视频播放
        </video>
      </div>
      <div class="video-info">
        <h2>AI 视频作品 #1</h2>
        <p class="meta">2026-06 · AI Generated</p>
        <div class="tags">
          <span class="tag">AI视频</span><span class="tag">AI创作</span>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <p class="footer-decor">新 · 月 · AI · 视 · 频</p>
  <div class="footer-links">
    <a href="../index.html">回主页</a>
    <a href="https://github.com/qtXingYue" target="_blank" rel="noopener">GitHub</a>
    <a href="../blog.html">博客</a>
  </div>
  <p style="margin-top:1rem">&copy; 2026 QT新月</p>
</footer>
</body>
</html>
