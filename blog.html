<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客 — QT新月</title>
<meta name="description" content="QT新月的博客，技术分享与生活记录。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Zen+Old+Mincho:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: oklch(8% 0.015 270);
  --bg-base: oklch(12% 0.012 270);
  --bg-raised: oklch(16% 0.010 270);
  --bg-high: oklch(20% 0.008 265);
  --accent: oklch(60% 0.18 280);
  --accent-soft: oklch(50% 0.13 280);
  --accent-dim: oklch(30% 0.08 280);
  --accent-glow: oklch(60% 0.18 280 / 0.3);
  --gold: oklch(80% 0.14 95);
  --text-primary: oklch(92% 0.01 270);
  --text-secondary: oklch(72% 0.01 270);
  --text-muted: oklch(50% 0.01 265);
  --border: oklch(100% 0 0 / 0.06);
  --glass-bg: oklch(100% 0 0 / 0.04);
  --header-h: 64px; --content-max: 900px;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; -webkit-font-smoothing:antialiased; }
body {
  font-family: 'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif;
  font-size: 1rem; line-height:1.8; color: var(--text-primary); background: var(--bg-deep); overflow-x:hidden;
}
body::before {
  content:''; position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, oklch(45% 0.12 300 / 0.3) 0%, transparent 60%),
    radial-gradient(ellipse 50% 70% at 85% 50%, oklch(50% 0.15 280 / 0.2) 0%, transparent 50%),
    radial-gradient(ellipse 50% 50% at 40% 80%, oklch(55% 0.08 270 / 0.15) 0%, transparent 60%);
  background-color: var(--bg-deep);
}
img { max-width:100%; display:block; }
a { color:var(--accent); text-decoration:none; transition:color 200ms var(--ease-out-expo); }
a:hover { color:var(--gold); }
.container { max-width:var(--content-max); margin-inline:auto; padding-inline:1.5rem; }

.noise-overlay {
  position:fixed; inset:0; z-index:9999; pointer-events:none; opacity:0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.site-header {
  position:fixed; top:0; left:0; right:0; z-index:100; height:var(--header-h);
  background:oklch(14% 0.015 270 / 0.55);
  backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border);
}
.header-inner { max-width:var(--content-max); margin-inline:auto; padding-inline:1.5rem; height:100%; display:flex; align-items:center; justify-content:space-between; }
.brand { display:flex; align-items:center; gap:0.5rem; font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:1rem; color:var(--text-primary); }
.brand-mark { width:28px; height:28px; border-radius:7px; background:linear-gradient(135deg,var(--accent),var(--accent-soft)); display:flex; align-items:center; justify-content:center; font-size:0.9rem; color:#fff; }

.page-hero { padding-block:calc(var(--header-h) + 3rem) 1.5rem; text-align:center; }
.page-hero h1 { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:2.5rem; }
.page-hero p { color:var(--text-secondary); font-size:0.875rem; margin-top:0.5rem; }

.article-list { padding-bottom:5rem; }
.article-card {
  background:var(--glass-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border); border-radius:16px; padding:1.5rem 2rem; margin-bottom:1rem;
  cursor:pointer; transition:all 300ms var(--ease-out-expo);
}
.article-card:hover { border-color:oklch(60% 0.18 280 / 0.2); transform:translateY(-2px); }
.article-date { font-size:0.75rem; color:var(--gold); margin-bottom:0.25rem; }
.article-title { font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:1.25rem; color:var(--text-primary); }
.article-excerpt { font-size:0.875rem; color:var(--text-secondary); margin-top:0.5rem; line-height:1.7; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.article-readmore { font-size:0.75rem; color:var(--accent); margin-top:0.75rem; }

.article-detail { display:none; padding-bottom:5rem; }
.article-detail.open { display:block; }
.article-detail h1 { font-family:'Zen Old Mincho',serif; font-weight:900; font-size:2rem; margin-bottom:0.5rem; color:var(--text-primary); }
.article-detail .meta { font-size:0.75rem; color:var(--gold); margin-bottom:2rem; }
.article-detail .body { line-height:2; color:var(--text-secondary); }
.article-detail .body h2,.article-detail .body h3 { color:var(--text-primary); margin-top:1.5rem; margin-bottom:0.5rem; }
.article-detail .body p { margin-bottom:1rem; }
.article-detail .body img { max-width:100%; border-radius:8px; margin:1rem 0; }
.article-detail .body pre { background:var(--bg-high); padding:1rem; border-radius:8px; overflow-x:auto; }
.article-detail .body code { background:oklch(60% 0.18 280 / 0.1); padding:0.125rem 0.375rem; border-radius:4px; font-size:0.9em; }
.article-detail .body blockquote { border-left:3px solid var(--accent); margin-left:0; padding-left:1rem; color:var(--text-muted); }

.back-btn {
  display:inline-flex; align-items:center; gap:0.25rem; font-size:0.875rem; color:var(--accent);
  padding:0.5rem 1rem; border:1px solid var(--accent-dim); border-radius:100px;
  cursor:pointer; transition:all 200ms; margin-bottom:2rem;
}
.back-btn:hover { background:var(--accent-dim); color:#fff; }

.loading { text-align:center; padding:3rem; color:var(--text-muted); }
.empty { text-align:center; padding:5rem 2rem; }
.empty-icon { font-size:3rem; margin-bottom:1rem; opacity:0.5; }
.empty h3 { color:var(--text-muted); font-family:'Zen Old Mincho',serif; font-size:1.5rem; margin-bottom:0.5rem; }
.empty p { color:var(--text-muted); font-size:0.875rem; }

.site-footer { border-top:1px solid var(--border); padding-block:2rem; text-align:center; color:var(--text-muted); font-size:0.75rem; }
.footer-decor { font-family:'Zen Old Mincho',serif; color:oklch(35% 0.03 270); letter-spacing:0.2em; margin-bottom:0.25rem; }
.footer-links { display:flex; justify-content:center; gap:1.5rem; margin-top:1rem; }
.footer-links a { font-size:0.75rem; color:var(--text-muted); }

@media (max-width:640px) {
  .article-card { padding:1rem 1.25rem; }
  .article-title { font-size:1.1rem; }
  .article-detail h1 { font-size:1.5rem; }
}
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:oklch(25% 0.01 270); border-radius:3px; }
</style>
</head>
<body>
<div class="noise-overlay" aria-hidden="true"></div>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand"><span class="brand-mark">月</span><span>QT新月</span></a>
    <a href="index.html" style="font-size:0.875rem;color:var(--text-secondary);">← 回主页</a>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>博客</h1>
    <p>技术笔记 · 生活随笔 · 创作记录</p>
  </div>
</section>

<div class="container">
  <!-- Article List -->
  <div class="article-list" id="articleList">
    <div class="loading">加载中...</div>
  </div>

  <!-- Article Detail -->
  <div class="article-detail" id="articleDetail">
    <button class="back-btn" onclick="backToList()">← 返回列表</button>
    <div id="articleContent"></div>
  </div>
</div>

<footer class="site-footer">
  <p class="footer-decor">新 · 月 · 博 · 客</p>
  <div class="footer-links">
    <a href="index.html">回主页</a>
    <a href="https://github.com/qtXingYue" target="_blank" rel="noopener">GitHub</a>
    <a href="admin">管理后台</a>
  </div>
  <p style="margin-top:1rem">&copy; 2026 QT新月</p>
</footer>

<script>
const BASE = window.location.origin;

async function loadArticles() {
  const list = document.getElementById('articleList');
  try {
    const resp = await fetch(BASE + '/api/articles');
    const articles = await resp.json();

    if (!articles.length) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📝</div>
          <h3>还没有文章</h3>
          <p>去 <a href="admin">管理后台</a> 写第一篇文章吧</p>
        </div>`;
      return;
    }

    list.innerHTML = articles.map(a => `
      <div class="article-card" onclick="loadArticle('${a.slug}')">
        <div class="article-date">${a.created_at?.slice(0,10)}</div>
        <h2 class="article-title">${a.title}</h2>
        ${a.excerpt ? `<p class="article-excerpt">${a.excerpt}</p>` : ''}
        <div class="article-readmore">阅读全文 →</div>
      </div>
    `).join('');
  } catch(e) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>加载失败</h3><p>后端服务可能未启动</p></div>`;
  }
}

async function loadArticle(slug) {
  try {
    const resp = await fetch(BASE + '/api/articles/' + slug);
    const a = await resp.json();
    document.getElementById('articleList').style.display = 'none';
    document.getElementById('articleDetail').classList.add('open');
    document.getElementById('articleContent').innerHTML = `
      <h1>${a.title}</h1>
      <div class="meta">${a.created_at?.slice(0,10)} · ${a.created_at?.slice(11,16) || ''}</div>
      <div class="body">${a.content}</div>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch(e) {
    alert('文章加载失败');
  }
}

function backToList() {
  document.getElementById('articleDetail').classList.remove('open');
  document.getElementById('articleList').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

loadArticles();
</script>
</body>
</html>
